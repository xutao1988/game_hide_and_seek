<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>躲猫猫手电筒</title>
<style>
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #111;
  font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
}

/* ====== 开屏 ====== */
#splash {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: linear-gradient(135deg, #1a1a3e, #0d0d2b);
  z-index: 9999;
  transition: opacity 0.5s;
}
#splash.hidden { opacity: 0; pointer-events: none; }
.splash-title {
  font-size: 10vmin; color: #ffe066;
  text-shadow: 0 0 4vmin rgba(255,224,102,0.5);
  margin-bottom: 2vmin;
}
.splash-sub {
  font-size: 4.5vmin; color: #aab;
  margin-bottom: 6vmin;
}
.splash-btn {
  font-size: 6vmin; padding: 3vmin 8vmin;
  border: none; border-radius: 8vmin;
  background: linear-gradient(135deg, #ffe066, #ffb347);
  color: #3a2a00; font-weight: bold;
  cursor: pointer;
  animation: btnPulse 2s ease-in-out infinite;
  box-shadow: 0 0.5vmin 2vmin rgba(255,179,71,0.5);
}
@keyframes btnPulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}
.splash-torch {
  font-size: 16vmin;
  margin-bottom: 3vmin;
  animation: torchSwing 3s ease-in-out infinite;
}
@keyframes torchSwing {
  0%,100% { transform: rotate(-15deg); }
  50% { transform: rotate(15deg); }
}

/* ====== 游戏容器 ====== */
#game {
  position: fixed; inset: 0;
  overflow: hidden;
  display: none;
}
#game.active { display: block; }

/* 场景背景 */
#sceneBg {
  position: absolute; inset: 0;
  transition: background 0.8s;
}

/* 物品层 */
#itemsLayer {
  position: absolute; inset: 0;
  z-index: 10;
}
.item {
  position: absolute;
  font-size: 14vmin;
  line-height: 1;
  text-align: center;
  transform: translate(-50%, -50%);
  transition: transform 0.1s;
  cursor: default;
}
.item.found {
  z-index: 200;
  animation: itemBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes itemBounce {
  0% { transform: translate(-50%, -50%) scale(1); }
  40% { transform: translate(-50%, -50%) scale(1.5); }
  100% { transform: translate(-50%, -50%) scale(1); }
}
.item-label {
  position: absolute;
  top: 110%; left: 50%;
  transform: translateX(-50%);
  font-size: 3.5vmin; color: #fff;
  white-space: nowrap;
  text-shadow: 0 0.3vmin 0.6vmin rgba(0,0,0,0.7);
  opacity: 0;
  animation: labelFadeIn 0.5s 0.2s forwards;
}
@keyframes labelFadeIn {
  to { opacity: 1; }
}

/* 装饰物品 */
.deco {
  position: absolute;
  font-size: 8vmin;
  line-height: 1;
  transform: translate(-50%, -50%);
  opacity: 0.7;
}

/* 手电筒遮罩 */
#flashlightMask {
  position: absolute; inset: 0;
  z-index: 100;
  pointer-events: none;
  background: radial-gradient(circle 15vmin at 50% 50%, transparent 0%, transparent 60%, rgba(0,0,0,0.97) 100%);
}
/* 暖光层 */
#warmGlow {
  position: absolute; inset: 0;
  z-index: 99;
  pointer-events: none;
  background: radial-gradient(circle 12vmin at 50% 50%, rgba(255,240,200,0.12) 0%, transparent 100%);
}

/* 收集栏 */
#collectBar {
  position: absolute;
  top: 2vmin; left: 50%;
  transform: translateX(-50%);
  display: flex; gap: 3vmin;
  z-index: 300;
}
.slot {
  width: 12vmin; height: 12vmin;
  border: 0.5vmin dashed rgba(255,255,255,0.5);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 7vmin;
  background: rgba(0,0,0,0.3);
  transition: all 0.4s;
}
.slot.filled {
  border-color: #ffe066;
  background: rgba(255,224,102,0.15);
  animation: slotPop 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes slotPop {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

/* 音效开关 */
#soundBtn {
  position: absolute;
  top: 2vmin; right: 2vmin;
  width: 8vmin; height: 8vmin;
  border: none; border-radius: 50%;
  background: rgba(0,0,0,0.4);
  font-size: 4.5vmin;
  z-index: 300;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
}

/* 场景介绍 */
#sceneIntro {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 500;
  background: rgba(0,0,0,0.85);
  opacity: 0;
  transition: opacity 0.4s;
  pointer-events: none;
}
#sceneIntro.show { opacity: 1; }
.intro-icon { font-size: 20vmin; margin-bottom: 2vmin; }
.intro-name {
  font-size: 8vmin; color: #ffe066;
  text-shadow: 0 0 3vmin rgba(255,224,102,0.5);
}

/* 新手引导 */
#tutorial {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 400;
  background: rgba(0,0,0,0.6);
  pointer-events: auto;
  transition: opacity 0.5s;
}
#tutorial.hidden { opacity: 0; pointer-events: none; }
.tut-hand {
  font-size: 14vmin;
  animation: tutSwipe 2s ease-in-out infinite;
}
@keyframes tutSwipe {
  0%   { transform: translate(-15vmin, 0) rotate(-20deg); }
  50%  { transform: translate(15vmin, 0) rotate(20deg); }
  100% { transform: translate(-15vmin, 0) rotate(-20deg); }
}
.tut-text {
  font-size: 5vmin; color: #fff;
  margin-top: 3vmin;
  opacity: 0.8;
}

/* 庆祝层 */
#celebration {
  position: absolute; inset: 0;
  z-index: 600;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.4s;
}
#celebration.show { opacity: 1; }
.celeb-text {
  font-size: 12vmin; color: #ffe066;
  text-shadow: 0 0 4vmin rgba(255,224,102,0.6);
  animation: celebBounce 0.8s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes celebBounce {
  0% { transform: scale(0); }
  60% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

/* 星星粒子 */
.star-particle {
  position: absolute;
  font-size: 4vmin;
  pointer-events: none;
  z-index: 250;
  animation: starBurst 0.7s ease-out forwards;
}
@keyframes starBurst {
  0% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(0.3); }
}

/* 纸屑粒子 */
.confetti {
  position: absolute;
  font-size: 5vmin;
  z-index: 610;
  pointer-events: none;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  0% { opacity: 1; transform: translateY(0) rotate(0deg); }
  100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
}

/* 提示脉冲 */
.hint-pulse {
  position: absolute;
  width: 10vmin; height: 10vmin;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,200,0.25) 0%, transparent 70%);
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  animation: hintGlow 2s ease-in-out infinite;
}
@keyframes hintGlow {
  0%,100% { opacity: 0; transform: translate(-50%,-50%) scale(0.8); }
  50% { opacity: 1; transform: translate(-50%,-50%) scale(1.2); }
}
</style>
</head>
<body>

<!-- 开屏 -->
<div id="splash">
  <div class="splash-torch">🔦</div>
  <div class="splash-title">躲猫猫</div>
  <div class="splash-sub">用手电筒找到藏起来的小伙伴</div>
  <button class="splash-btn" id="startBtn">开始探险</button>
</div>

<!-- 游戏 -->
<div id="game">
  <div id="sceneBg"></div>
  <div id="itemsLayer"></div>
  <div id="warmGlow"></div>
  <div id="flashlightMask"></div>
  <div id="collectBar"></div>
  <button id="soundBtn">🔊</button>

  <div id="sceneIntro">
    <div class="intro-icon" id="introIcon"></div>
    <div class="intro-name" id="introName"></div>
  </div>

  <div id="tutorial">
    <div class="tut-hand">👆</div>
    <div class="tut-text">用手指滑动，移动手电筒</div>
  </div>

  <div id="celebration">
    <div class="celeb-text">太棒了！🎉</div>
  </div>
</div>

<script>
(function(){
  'use strict';

  // ====== 场景数据 ======
  const SCENES = [
    {
      name: '卧室', icon: '🏠',
      bg: 'linear-gradient(180deg, #1a1433 0%, #2d1f4e 40%, #3d2a5c 100%)',
      items: [
        { emoji: '🧸', name: '小熊', x: 25, y: 45 },
        { emoji: '🌙', name: '月亮', x: 72, y: 30 },
        { emoji: '⭐', name: '星星', x: 55, y: 70 }
      ],
      decos: [
        { emoji: '🛏️', x: 50, y: 82 },
        { emoji: '🪟', x: 80, y: 25 },
        { emoji: '🕯️', x: 15, y: 72 },
        { emoji: '📚', x: 85, y: 65 }
      ]
    },
    {
      name: '花园', icon: '🌳',
      bg: 'linear-gradient(180deg, #0a2a1a 0%, #1a3d2a 40%, #2a4d3a 100%)',
      items: [
        { emoji: '🦋', name: '蝴蝶', x: 30, y: 38 },
        { emoji: '🐞', name: '瓢虫', x: 68, y: 65 },
        { emoji: '🌻', name: '向日葵', x: 48, y: 52 }
      ],
      decos: [
        { emoji: '🌷', x: 18, y: 75 },
        { emoji: '🌿', x: 82, y: 40 },
        { emoji: '🍄', x: 35, y: 80 },
        { emoji: '🪴', x: 75, y: 78 }
      ]
    },
    {
      name: '动物园', icon: '🦁',
      bg: 'linear-gradient(180deg, #2a1f0a 0%, #3d2f1a 40%, #4d3f2a 100%)',
      items: [
        { emoji: '🦁', name: '狮子', x: 22, y: 55 },
        { emoji: '🐘', name: '大象', x: 70, y: 42 },
        { emoji: '🐵', name: '猴子', x: 50, y: 68 }
      ],
      decos: [
        { emoji: '🌴', x: 12, y: 35 },
        { emoji: '🎋', x: 88, y: 55 },
        { emoji: '🪨', x: 40, y: 85 },
        { emoji: '🦜', x: 78, y: 25 }
      ]
    },
    {
      name: '海底世界', icon: '🌊',
      bg: 'linear-gradient(180deg, #0a1a3d 0%, #0d2a5e 40%, #103a7e 100%)',
      items: [
        { emoji: '🐟', name: '小鱼', x: 35, y: 42 },
        { emoji: '🐙', name: '章鱼', x: 65, y: 60 },
        { emoji: '🐢', name: '海龟', x: 28, y: 72 }
      ],
      decos: [
        { emoji: '🪸', x: 75, y: 80 },
        { emoji: '🫧', x: 20, y: 30 },
        { emoji: '🐚', x: 55, y: 85 },
        { emoji: '🌊', x: 85, y: 35 }
      ]
    },
    {
      name: '农场', icon: '🐄',
      bg: 'linear-gradient(180deg, #1a2a0a 0%, #2a3d1a 40%, #3a4d2a 100%)',
      items: [
        { emoji: '🐄', name: '奶牛', x: 25, y: 58 },
        { emoji: '🐔', name: '小鸡', x: 72, y: 48 },
        { emoji: '🐷', name: '小猪', x: 48, y: 72 }
      ],
      decos: [
        { emoji: '🌾', x: 15, y: 40 },
        { emoji: '🏡', x: 80, y: 28 },
        { emoji: '🌽', x: 60, y: 85 },
        { emoji: '🚜', x: 35, y: 30 }
      ]
    }
  ];

  // ====== 状态 ======
  let currentScene = 0;
  let foundItems = [];
  let sceneItems = [];
  let flashX = 50, flashY = 50; // 百分比
  let soundEnabled = true;
  let audioCtx = null;
  let bgMusicTimer = null;
  let hintTimer = null;
  let isPlaying = false;
  let tutorialShown = false;
  let gameStarted = false;

  // ====== DOM ======
  const splash = document.getElementById('splash');
  const startBtn = document.getElementById('startBtn');
  const game = document.getElementById('game');
  const sceneBg = document.getElementById('sceneBg');
  const itemsLayer = document.getElementById('itemsLayer');
  const flashlightMask = document.getElementById('flashlightMask');
  const warmGlow = document.getElementById('warmGlow');
  const collectBar = document.getElementById('collectBar');
  const soundBtn = document.getElementById('soundBtn');
  const sceneIntro = document.getElementById('sceneIntro');
  const introIcon = document.getElementById('introIcon');
  const introName = document.getElementById('introName');
  const tutorial = document.getElementById('tutorial');
  const celebration = document.getElementById('celebration');

  // ====== localStorage ======
  const LS_SCENE = 'dabing_hideseek_highScene';
  const LS_SOUND = 'dabing_hideseek_soundEnabled';

  function loadPrefs() {
    const s = localStorage.getItem(LS_SOUND);
    if (s !== null) soundEnabled = s === 'true';
    soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
  }
  function saveSound() {
    localStorage.setItem(LS_SOUND, String(soundEnabled));
  }
  function saveHighScene() {
    const prev = parseInt(localStorage.getItem(LS_SCENE) || '0', 10);
    if (currentScene > prev) localStorage.setItem(LS_SCENE, String(currentScene));
  }

  // ====== Audio ======
  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playTone(freq, startTime, duration, vol) {
    if (!soundEnabled || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, startTime);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration);
  }

  function playDiscoverSound() {
    if (!soundEnabled) return;
    ensureAudio();
    const t = audioCtx.currentTime;
    // C5 → E5 → G5 上行三音
    playTone(523.25, t, 0.2, 0.18);
    playTone(659.25, t + 0.12, 0.2, 0.18);
    playTone(783.99, t + 0.24, 0.3, 0.22);
  }

  function playCelebSound() {
    if (!soundEnabled) return;
    ensureAudio();
    const t = audioCtx.currentTime;
    // 五音庆祝旋律 C5 E5 G5 A5 C6
    const notes = [523.25, 659.25, 783.99, 880, 1046.5];
    notes.forEach(function(f, i) {
      playTone(f, t + i * 0.12, 0.3, 0.15);
    });
  }

  function startBgMusic() {
    stopBgMusic();
    if (!soundEnabled) return;
    var bgActive = true;
    var pentatonic = [261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25];
    function playNext() {
      if (!bgActive || !soundEnabled || !audioCtx) return;
      var freq = pentatonic[Math.floor(Math.random() * pentatonic.length)];
      var t = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.03, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 1.2);
      bgMusicTimer = setTimeout(playNext, 600 + Math.random() * 1400);
    }
    bgMusicTimer = setTimeout(playNext, 500);
  }

  function stopBgMusic() {
    if (bgMusicTimer) { clearTimeout(bgMusicTimer); bgMusicTimer = null; }
  }

  // ====== 手电筒 ======
  function updateFlashlight(px, py) {
    // px, py 是页面像素坐标
    const w = window.innerWidth;
    const h = window.innerHeight;
    flashX = (px / w) * 100;
    flashY = (py / h) * 100;

    flashlightMask.style.background =
      'radial-gradient(circle 15vmin at ' + px + 'px ' + py + 'px, transparent 0%, transparent 55%, rgba(0,0,0,0.95) 100%)';
    warmGlow.style.background =
      'radial-gradient(circle 12vmin at ' + px + 'px ' + py + 'px, rgba(255,240,200,0.12) 0%, transparent 100%)';

    checkDiscovery(px, py);
  }

  // ====== 发现检测 ======
  function checkDiscovery(px, py) {
    if (!isPlaying) return;
    const vmin = Math.min(window.innerWidth, window.innerHeight);
    const radius = vmin * 0.15 * 0.7; // 光圈半径 15vmin × 0.7

    sceneItems.forEach(function(si, idx) {
      if (foundItems.includes(idx)) return;
      const rect = si.el.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dist = Math.sqrt((px - cx) * (px - cx) + (py - cy) * (py - cy));

      if (dist < radius) {
        discoverItem(idx);
      }
    });
  }

  function discoverItem(idx) {
    if (foundItems.includes(idx)) return;
    foundItems.push(idx);

    const si = sceneItems[idx];
    const el = si.el;
    el.classList.add('found');

    // 名称标签
    const label = document.createElement('div');
    label.className = 'item-label';
    label.textContent = si.data.name;
    el.appendChild(label);

    // 星星粒子
    spawnStars(el);

    // 音效
    playDiscoverSound();

    // 更新收集栏
    const slot = collectBar.children[idx];
    if (slot) {
      slot.textContent = si.data.emoji;
      slot.classList.add('filled');
    }

    // 重置提示计时
    resetHintTimer();

    // 移除该物品的提示脉冲
    const hint = document.querySelector('.hint-pulse[data-idx="' + idx + '"]');
    if (hint) hint.remove();

    // 检查是否全部找到
    if (foundItems.length === sceneItems.length) {
      setTimeout(celebrateScene, 500);
    }
  }

  function spawnStars(el) {
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const emojis = ['⭐', '✨', '🌟', '💫'];

    for (let i = 0; i < 8; i++) {
      const star = document.createElement('div');
      star.className = 'star-particle';
      star.textContent = emojis[i % emojis.length];
      const angle = (i / 8) * Math.PI * 2;
      const dist = 12; // vmin
      const tx = cx + Math.cos(angle) * (dist * Math.min(window.innerWidth, window.innerHeight) / 100);
      const ty = cy + Math.sin(angle) * (dist * Math.min(window.innerWidth, window.innerHeight) / 100);
      star.style.left = tx + 'px';
      star.style.top = ty + 'px';
      document.getElementById('game').appendChild(star);
      setTimeout(function() { star.remove(); }, 700);
    }
  }

  // ====== 提示系统 ======
  function resetHintTimer() {
    clearTimeout(hintTimer);
    // 移除所有现有提示
    document.querySelectorAll('.hint-pulse').forEach(function(h) { h.remove(); });

    if (!isPlaying) return;
    hintTimer = setTimeout(showHints, 8000);
  }

  function showHints() {
    if (!isPlaying) return;
    sceneItems.forEach(function(si, idx) {
      if (foundItems.includes(idx)) return;
      const hint = document.createElement('div');
      hint.className = 'hint-pulse';
      hint.dataset.idx = idx;
      hint.style.left = si.data.x + '%';
      hint.style.top = si.data.y + '%';
      itemsLayer.appendChild(hint);
    });
  }

  // ====== 场景管理 ======
  function loadScene(idx) {
    isPlaying = false;
    foundItems = [];
    sceneItems = [];

    // 清空
    itemsLayer.innerHTML = '';
    collectBar.innerHTML = '';
    document.querySelectorAll('.star-particle, .confetti, .hint-pulse').forEach(function(e) { e.remove(); });

    const scene = SCENES[idx];
    sceneBg.style.background = scene.bg;

    // 收集槽
    scene.items.forEach(function() {
      const slot = document.createElement('div');
      slot.className = 'slot';
      collectBar.appendChild(slot);
    });

    // 装饰物
    scene.decos.forEach(function(d) {
      const el = document.createElement('div');
      el.className = 'deco';
      el.textContent = d.emoji;
      el.style.left = d.x + '%';
      el.style.top = d.y + '%';
      itemsLayer.appendChild(el);
    });

    // 隐藏物品
    scene.items.forEach(function(item, i) {
      const el = document.createElement('div');
      el.className = 'item';
      el.textContent = item.emoji;
      el.style.left = item.x + '%';
      el.style.top = item.y + '%';
      itemsLayer.appendChild(el);
      sceneItems.push({ el: el, data: item });
    });

    // 场景介绍
    introIcon.textContent = scene.icon;
    introName.textContent = scene.name;
    sceneIntro.classList.add('show');

    // 重置手电筒到中心
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    updateFlashlight(cx, cy);

    setTimeout(function() {
      sceneIntro.classList.remove('show');
      isPlaying = true;
      resetHintTimer();
      startBgMusic();
    }, 1500);
  }

  function celebrateScene() {
    isPlaying = false;
    stopBgMusic();
    clearTimeout(hintTimer);
    document.querySelectorAll('.hint-pulse').forEach(function(h) { h.remove(); });

    // 遮罩变亮
    flashlightMask.style.background = 'rgba(0,0,0,0.3)';
    warmGlow.style.background = 'none';

    // 庆祝文字
    celebration.classList.add('show');

    // 音效
    playCelebSound();

    // 纸屑
    spawnConfetti();

    saveHighScene();

    // 下一场景
    setTimeout(function() {
      celebration.classList.remove('show');
      flashlightMask.style.background = '';
      currentScene = (currentScene + 1) % SCENES.length;
      loadScene(currentScene);
    }, 2500);
  }

  function spawnConfetti() {
    const emojis = ['🎉', '🎊', '⭐', '💛', '🌟', '🎈', '🧡', '💜'];
    for (let i = 0; i < 20; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.textContent = emojis[i % emojis.length];
      c.style.left = (Math.random() * 90 + 5) + '%';
      c.style.top = '-8vmin';
      c.style.animationDuration = (2 + Math.random() * 1.5) + 's';
      c.style.animationDelay = (Math.random() * 0.8) + 's';
      game.appendChild(c);
      setTimeout(function() { c.remove(); }, 4500);
    }
  }

  // ====== 事件 ======
  function handlePointer(e) {
    e.preventDefault();
    let px, py;
    if (e.touches && e.touches.length > 0) {
      px = e.touches[0].clientX;
      py = e.touches[0].clientY;
    } else {
      px = e.clientX;
      py = e.clientY;
    }

    // 首次触摸：隐藏教程
    if (!tutorialShown && gameStarted) {
      tutorialShown = true;
      tutorial.classList.add('hidden');
    }

    updateFlashlight(px, py);
  }

  // 触摸事件
  game.addEventListener('touchstart', handlePointer, { passive: false });
  game.addEventListener('touchmove', handlePointer, { passive: false });

  // 鼠标事件（桌面测试用）
  game.addEventListener('mousedown', handlePointer);
  game.addEventListener('mousemove', handlePointer);

  // 音效开关
  soundBtn.addEventListener('touchstart', function(e) {
    e.stopPropagation();
    e.preventDefault();
    toggleSound();
  });
  soundBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    toggleSound();
  });

  function toggleSound() {
    soundEnabled = !soundEnabled;
    soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
    saveSound();
    if (soundEnabled) {
      ensureAudio();
      startBgMusic();
    } else {
      stopBgMusic();
    }
  }

  // 开始按钮
  startBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    startGame();
  });
  startBtn.addEventListener('click', function(e) {
    startGame();
  });

  function startGame() {
    if (gameStarted) return;
    gameStarted = true;
    ensureAudio();
    splash.classList.add('hidden');
    game.classList.add('active');
    loadScene(currentScene);
  }

  // 阻止默认滚动/缩放
  document.addEventListener('touchmove', function(e) {
    if (e.target.closest('#game')) e.preventDefault();
  }, { passive: false });

  // ====== 初始化 ======
  loadPrefs();

})();
</script>
</body>
</html>
