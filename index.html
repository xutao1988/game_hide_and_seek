<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>躲猫猫手电筒</title>
<style>
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #111;
  font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
}

/* ====== 开屏 ====== */
#splash {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: linear-gradient(135deg, #1a1a3e, #0d0d2b);
  z-index: 9999;
  transition: opacity 0.5s;
}
#splash.hidden { opacity: 0; pointer-events: none; }
.splash-title {
  font-size: 10vmin; color: #ffe066;
  text-shadow: 0 0 4vmin rgba(255,224,102,0.5);
  margin-bottom: 2vmin;
}
.splash-sub {
  font-size: 4.5vmin; color: #aab;
  margin-bottom: 6vmin;
}
.splash-btn {
  font-size: 6vmin; padding: 3vmin 8vmin;
  border: none; border-radius: 8vmin;
  background: linear-gradient(135deg, #ffe066, #ffb347);
  color: #3a2a00; font-weight: bold;
  cursor: pointer;
  animation: btnPulse 2s ease-in-out infinite;
  box-shadow: 0 0.5vmin 2vmin rgba(255,179,71,0.5);
}
@keyframes btnPulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}
.splash-torch {
  font-size: 16vmin;
  margin-bottom: 3vmin;
  animation: torchSwing 3s ease-in-out infinite;
}
@keyframes torchSwing {
  0%,100% { transform: rotate(-15deg); }
  50% { transform: rotate(15deg); }
}

/* ====== 游戏导航 ====== */
.game-nav {
  margin-top: 5vmin;
  width: 80%;
  max-width: 500px;
}
.nav-title {
  font-size: 3.8vmin; color: #aab;
  text-align: center;
  margin-bottom: 2vmin;
}
.nav-links {
  display: flex; flex-wrap: wrap;
  justify-content: center; gap: 1.5vmin;
}
.nav-link {
  font-size: 3vmin; color: #ccd;
  text-decoration: none;
  padding: 1.2vmin 2.5vmin;
  border-radius: 4vmin;
  background: rgba(255,255,255,0.08);
  transition: background 0.2s, transform 0.15s;
  white-space: nowrap;
}
.nav-link:active {
  transform: scale(0.95);
  background: rgba(255,255,255,0.15);
}
.nav-link.current {
  background: rgba(255,224,102,0.18);
  color: #ffe066;
  pointer-events: none;
}

/* ====== 游戏容器 ====== */
#game {
  position: fixed; inset: 0;
  overflow: hidden;
  display: none;
}
#game.active { display: block; }

/* 场景背景 */
#sceneBg {
  position: absolute; inset: 0;
  transition: background 0.8s;
}

/* 物品层 */
#itemsLayer {
  position: absolute; inset: 0;
  z-index: 10;
}
.item {
  position: absolute;
  font-size: 14vmin;
  line-height: 1;
  text-align: center;
  transform: translate(-50%, -50%);
  cursor: default;
}
.item.found {
  z-index: 200;
  animation: itemBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes itemBounce {
  0% { transform: translate(-50%, -50%) scale(1); }
  40% { transform: translate(-50%, -50%) scale(1.5); }
  100% { transform: translate(-50%, -50%) scale(1); }
}
.item-label {
  position: absolute;
  top: 110%; left: 50%;
  transform: translateX(-50%);
  font-size: 3.5vmin; color: #fff;
  white-space: nowrap;
  text-shadow: 0 0.3vmin 0.6vmin rgba(0,0,0,0.7);
  opacity: 0;
  animation: labelFadeIn 0.5s 0.2s forwards;
}
@keyframes labelFadeIn {
  to { opacity: 1; }
}

/* 大饼特殊发现动画 */
.item.found-dabing {
  z-index: 200;
  animation: dabingBounce 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes dabingBounce {
  0% { transform: translate(-50%, -50%) scale(1); }
  25% { transform: translate(-50%, -50%) scale(1.8); }
  50% { transform: translate(-50%, -50%) scale(1.2); }
  75% { transform: translate(-50%, -50%) scale(1.5); }
  100% { transform: translate(-50%, -50%) scale(1); }
}
.item.found-dabing .item-photo {
  box-shadow: 0 0 3vmin rgba(255,224,102,0.8), 0 0 6vmin rgba(255,179,71,0.4);
}

/* 照片物品 */
.item-photo {
  display: block;
  width: 14vmin;
  height: 14vmin;
  border-radius: 50%;
  border: 0.6vmin solid #ffe066;
  box-shadow: 0 0 1.5vmin rgba(255,224,102,0.4);
  object-fit: cover;
  pointer-events: none;
}
.slot-photo {
  width: 80%;
  height: 80%;
  border-radius: 50%;
  object-fit: cover;
}

/* 物品被光照到时微晃动 */
.item.item-lit {
  animation: itemWobble 0.5s ease-in-out infinite;
}
@keyframes itemWobble {
  0%,100% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
  25% { transform: translate(-50%, -50%) rotate(-6deg) scale(1.05); }
  75% { transform: translate(-50%, -50%) rotate(6deg) scale(1.05); }
}

/* 装饰物品 */
.deco {
  position: absolute;
  font-size: 8vmin;
  line-height: 1;
  transform: translate(-50%, -50%);
  opacity: 0.7;
  transition: transform 0.2s, opacity 0.2s;
}
.deco.deco-lit {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1.2);
}

/* 英文大字展示 */
.word-flash {
  position: absolute;
  top: 45%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 14vmin;
  font-weight: bold;
  color: #ffe066;
  text-shadow: 0 0 3vmin rgba(255,224,102,0.6), 0 0.5vmin 1vmin rgba(0,0,0,0.5);
  z-index: 350;
  pointer-events: none;
  animation: wordFlash 2.2s ease-in-out forwards;
}
@keyframes wordFlash {
  0% { opacity: 0; transform: translate(-50%,-50%) scale(0.4); }
  12% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
  25% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  75% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(0.8); }
}

/* 手电筒遮罩 */
#flashlightMask {
  position: absolute; inset: 0;
  z-index: 100;
  pointer-events: none;
  background: radial-gradient(circle 15vmin at 50% 50%, transparent 0%, transparent 60%, rgba(0,0,0,0.97) 100%);
}
/* 暖光层 */
#warmGlow {
  position: absolute; inset: 0;
  z-index: 99;
  pointer-events: none;
  background: radial-gradient(circle 12vmin at 50% 50%, rgba(255,240,200,0.12) 0%, transparent 100%);
}

/* 收集栏 */
#collectBar {
  position: absolute;
  top: 2vmin; left: 50%;
  transform: translateX(-50%);
  display: flex; gap: 1.5vmin;
  z-index: 300;
}
.slot {
  width: 9vmin; height: 9vmin;
  border: 0.4vmin dashed rgba(255,255,255,0.5);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 5.5vmin;
  background: rgba(0,0,0,0.3);
  transition: all 0.4s;
}
.slot.filled {
  border-color: #ffe066;
  background: rgba(255,224,102,0.15);
  animation: slotPop 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes slotPop {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

/* 音效开关 */
#soundBtn {
  position: absolute;
  top: 2vmin; right: 2vmin;
  width: 8vmin; height: 8vmin;
  border: none; border-radius: 50%;
  background: rgba(0,0,0,0.4);
  font-size: 4.5vmin;
  z-index: 300;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
}

/* 场景介绍 */
#sceneIntro {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 500;
  background: rgba(0,0,0,0.85);
  opacity: 0;
  transition: opacity 0.4s;
  pointer-events: none;
}
#sceneIntro.show { opacity: 1; }
.intro-icon { font-size: 20vmin; margin-bottom: 2vmin; }
.intro-name {
  font-size: 8vmin; color: #ffe066;
  text-shadow: 0 0 3vmin rgba(255,224,102,0.5);
}

/* 新手引导 */
#tutorial {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 400;
  background: rgba(0,0,0,0.6);
  pointer-events: auto;
  transition: opacity 0.5s;
}
#tutorial.hidden { opacity: 0; pointer-events: none; }
.tut-hand {
  font-size: 14vmin;
  animation: tutSwipe 2s ease-in-out infinite;
}
@keyframes tutSwipe {
  0%   { transform: translate(-15vmin, 0) rotate(-20deg); }
  50%  { transform: translate(15vmin, 0) rotate(20deg); }
  100% { transform: translate(-15vmin, 0) rotate(-20deg); }
}
.tut-text {
  font-size: 5vmin; color: #fff;
  margin-top: 3vmin;
  opacity: 0.8;
}

/* 庆祝层 */
#celebration {
  position: absolute; inset: 0;
  z-index: 600;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.4s;
}
#celebration.show { opacity: 1; }
.celeb-text {
  font-size: 12vmin; color: #ffe066;
  text-shadow: 0 0 4vmin rgba(255,224,102,0.6);
  animation: celebBounce 0.8s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes celebBounce {
  0% { transform: scale(0); }
  60% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

/* 星星粒子 */
.star-particle {
  position: absolute;
  font-size: 4vmin;
  pointer-events: none;
  z-index: 250;
  animation: starBurst 0.7s ease-out forwards;
}
@keyframes starBurst {
  0% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(0.3); }
}

/* 纸屑粒子 */
.confetti {
  position: absolute;
  font-size: 5vmin;
  z-index: 610;
  pointer-events: none;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  0% { opacity: 1; transform: translateY(0) rotate(0deg); }
  100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
}

/* 提示脉冲 */
.hint-pulse {
  position: absolute;
  width: 10vmin; height: 10vmin;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,200,0.25) 0%, transparent 70%);
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  animation: hintGlow 2s ease-in-out infinite;
}
@keyframes hintGlow {
  0%,100% { opacity: 0; transform: translate(-50%,-50%) scale(0.8); }
  50% { opacity: 1; transform: translate(-50%,-50%) scale(1.2); }
}
</style>
</head>

    soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
  }
  function saveSound() {
    localStorage.setItem(LS_SOUND, String(soundEnabled));
  }
  function saveHighScene() {
    const prev = parseInt(localStorage.getItem(LS_SCENE) || '0', 10);
    if (currentScene > prev) localStorage.setItem(LS_SCENE, String(currentScene));
  }

  // ====== Audio ======
  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playTone(freq, startTime, duration, vol) {
    if (!soundEnabled || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, startTime);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration);
  }

  function playDecoSound() {
    if (!soundEnabled || !audioCtx) return;
    var t = audioCtx.currentTime;
    // 轻柔的木鱼"咚"声
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(350, t);
    osc.frequency.exponentialRampToValueAtTime(180, t + 0.12);
    gain.gain.setValueAtTime(0.1, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.15);
  }

  function playDiscoverSound() {
    if (!soundEnabled) return;
    ensureAudio();
    const t = audioCtx.currentTime;
    // C5 → E5 → G5 上行三音
    playTone(523.25, t, 0.2, 0.18);
    playTone(659.25, t + 0.12, 0.2, 0.18);
    playTone(783.99, t + 0.24, 0.3, 0.22);
  }

  function playCelebSound() {
    if (!soundEnabled) return;
    ensureAudio();
    const t = audioCtx.currentTime;
    // 五音庆祝旋律 C5 E5 G5 A5 C6
    const notes = [523.25, 659.25, 783.99, 880, 1046.5];
    notes.forEach(function(f, i) {
      playTone(f, t + i * 0.12, 0.3, 0.15);
    });
  }

  function playDabingSound() {
    if (!soundEnabled) return;
    ensureAudio();
    var t = audioCtx.currentTime;
    // 温暖的和弦铺底（持续音）
    var pad = audioCtx.createOscillator();
    var padGain = audioCtx.createGain();
    pad.type = 'sine';
    pad.frequency.value = 261.63; // C4
    padGain.gain.setValueAtTime(0.08, t);
    padGain.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
    pad.connect(padGain); padGain.connect(audioCtx.destination);
    pad.start(t); pad.stop(t + 1.2);
    // 欢快上行fanfare: C5 E5 G5 C6，最后一个音长一些
    playTone(523.25, t, 0.18, 0.2);
    playTone(659.25, t + 0.12, 0.18, 0.22);
    playTone(783.99, t + 0.24, 0.18, 0.24);
    playTone(1046.5, t + 0.38, 0.5, 0.26);
    // 高音点缀（八度泛音）
    var shimmer = audioCtx.createOscillator();
    var shimGain = audioCtx.createGain();
    shimmer.type = 'sine';
    shimmer.frequency.value = 2093; // C7
    shimGain.gain.setValueAtTime(0.04, t + 0.38);
    shimGain.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
    shimmer.connect(shimGain); shimGain.connect(audioCtx.destination);
    shimmer.start(t + 0.38); shimmer.stop(t + 0.9);
  }

  // ====== 语音系统（自动选择最佳声音） ======
  var bestVoiceZH = null;
  var bestVoiceEN = null;

  function cacheVoices() {
    if (!('speechSynthesis' in window)) return;
    var voices = window.speechSynthesis.getVoices();
    if (!voices.length) return;

    // 中文语音：优先 Enhanced/Premium，然后 zh-CN
    var zhVoices = voices.filter(function(v) { return v.lang.indexOf('zh') === 0; });
    var preferred = zhVoices.filter(function(v) {
      var n = v.name.toLowerCase();
      return n.indexOf('enhanced') !== -1 || n.indexOf('premium') !== -1;
    });
    if (preferred.length) {
      // 偏好 zh-CN 的增强语音
      bestVoiceZH = preferred.filter(function(v) { return v.lang.indexOf('CN') !== -1; })[0] || preferred[0];
    } else {
      bestVoiceZH = zhVoices.filter(function(v) { return v.lang.indexOf('CN') !== -1; })[0] || zhVoices[0] || null;
    }

    // 英文语音：优先 Enhanced/Premium，然后 en-US
    var enVoices = voices.filter(function(v) { return v.lang.indexOf('en') === 0; });
    var enPref = enVoices.filter(function(v) {
      var n = v.name.toLowerCase();
      return n.indexOf('enhanced') !== -1 || n.indexOf('premium') !== -1;
    });
    if (enPref.length) {
      bestVoiceEN = enPref.filter(function(v) { return v.lang.indexOf('US') !== -1; })[0] || enPref[0];
    } else {
      bestVoiceEN = enVoices.filter(function(v) { return v.lang.indexOf('US') !== -1; })[0] || enVoices[0] || null;
    }
  }

  // 语音列表可能异步加载
  if ('speechSynthesis' in window) {
    cacheVoices();
    window.speechSynthesis.addEventListener('voiceschanged', cacheVoices);
  }

  function speakEnglish(text) {
    if (!soundEnabled) return;
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    var utter = new SpeechSynthesisUtterance(text);
    if (bestVoiceEN) utter.voice = bestVoiceEN;
    utter.lang = 'en-US';
    utter.rate = 0.8;
    utter.pitch = 1.1;
    utter.volume = 0.9;
    window.speechSynthesis.speak(utter);
  }

  function speakChinese(text) {
    if (!soundEnabled) return;
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    var utter = new SpeechSynthesisUtterance(text);
    if (bestVoiceZH) utter.voice = bestVoiceZH;
    utter.lang = 'zh-CN';
    utter.rate = 0.85;
    utter.pitch = 1.3;
    utter.volume = 1.0;
    window.speechSynthesis.speak(utter);
  }

  function startBgMusic() {
    stopBgMusic();
    if (!soundEnabled) return;
    var bgActive = true;
    var pentatonic = [261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25];
    function playNext() {
      if (!bgActive || !soundEnabled || !audioCtx) return;
      var freq = pentatonic[Math.floor(Math.random() * pentatonic.length)];
      var t = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.03, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 1.2);
      bgMusicTimer = setTimeout(playNext, 600 + Math.random() * 1400);
    }
    bgMusicTimer = setTimeout(playNext, 500);
  }

  function stopBgMusic() {
    if (bgMusicTimer) { clearTimeout(bgMusicTimer); bgMusicTimer = null; }
  }

  // ====== 手电筒 ======
  function updateFlashlight(px, py) {
    // px, py 是页面像素坐标
    const w = window.innerWidth;
    const h = window.innerHeight;
    flashX = (px / w) * 100;
    flashY = (py / h) * 100;

    flashlightMask.style.background =
      'radial-gradient(circle 15vmin at ' + px + 'px ' + py + 'px, transparent 0%, transparent 55%, rgba(0,0,0,0.95) 100%)';
    warmGlow.style.background =
      'radial-gradient(circle 12vmin at ' + px + 'px ' + py + 'px, rgba(255,240,200,0.12) 0%, transparent 100%)';

    checkDiscovery(px, py);
  }

  // ====== 发现检测 + 光照反馈 ======
  function checkDiscovery(px, py) {
    if (!isPlaying) return;
    var vmin = Math.min(window.innerWidth, window.innerHeight);
    var discoverRadius = vmin * 0.15 * 0.7;
    var lightRadius = vmin * 0.15;

    // 检测隐藏物品：发现 + 光照微晃
    sceneItems.forEach(function(si, idx) {
      if (foundItems.includes(idx)) {
        si.el.classList.remove('item-lit');
        return;
      }
      var rect = si.el.getBoundingClientRect();
      var cx = rect.left + rect.width / 2;
      var cy = rect.top + rect.height / 2;
      var dist = Math.sqrt((px - cx) * (px - cx) + (py - cy) * (py - cy));

      if (dist < discoverRadius) {
        si.el.classList.remove('item-lit');
        discoverItem(idx);
      } else if (dist < lightRadius) {
        si.el.classList.add('item-lit');
      } else {
        si.el.classList.remove('item-lit');
      }
    });

    // 检测装饰物：进入光圈时播放轻音效
    sceneDecos.forEach(function(sd, idx) {
      var rect = sd.el.getBoundingClientRect();
      var cx = rect.left + rect.width / 2;
      var cy = rect.top + rect.height / 2;
      var dist = Math.sqrt((px - cx) * (px - cx) + (py - cy) * (py - cy));

      if (dist < lightRadius) {
        if (!litDecos.has(idx)) {
          litDecos.add(idx);
          sd.el.classList.add('deco-lit');
          playDecoSound();
        }
      } else {
        if (litDecos.has(idx)) {
          litDecos.delete(idx);
          sd.el.classList.remove('deco-lit');
        }
      }
    });
  }

  function discoverItem(idx) {
    if (foundItems.includes(idx)) return;
    foundItems.push(idx);

    const si = sceneItems[idx];
    const el = si.el;
    const isDabing = !!si.data.photo;

    if (isDabing) {
      el.classList.add('found-dabing');
    } else {
      el.classList.add('found');
    }

    // 名称标签
    const label = document.createElement('div');
    label.className = 'item-label';
    label.textContent = isDabing ? '找到大饼啦！' : (si.data.name + ' ' + si.data.en);
    el.appendChild(label);

    // 星星粒子（大饼用更多、更丰富的粒子）
    if (isDabing) {
      spawnStars(el, 14, ['⭐', '💛', '❤️', '🌟', '✨', '💫', '🎉', '🥳']);
    } else {
      spawnStars(el, 8, ['⭐', '✨', '🌟', '💫']);
    }

    // 英文大字展示（大饼除外）
    if (!isDabing) {
      var wordEl = document.createElement('div');
      wordEl.className = 'word-flash';
      wordEl.textContent = si.data.en;
      game.appendChild(wordEl);
      setTimeout(function() { wordEl.remove(); }, 2500);
    }

    // 音效 + 语音
    if (isDabing) {
      playDabingSound();
      setTimeout(function() { speakChinese('找到大饼啦'); }, 600);
    } else {
      playDiscoverSound();
      setTimeout(function() { speakEnglish(si.data.en); }, 300);
    }

    // 更新收集栏
    const slot = collectBar.children[idx];
    if (slot) {
      if (si.data.photo) {
        var slotImg = document.createElement('img');
        slotImg.src = si.data.photo;
        slotImg.className = 'slot-photo';
        slotImg.draggable = false;
        slot.textContent = '';
        slot.appendChild(slotImg);
      } else {
        slot.textContent = si.data.emoji;
      }
      slot.classList.add('filled');
    }

    // 重置提示计时
    resetHintTimer();

    // 移除该物品的提示脉冲
    const hint = document.querySelector('.hint-pulse[data-idx="' + idx + '"]');
    if (hint) hint.remove();

    // 检查是否全部找到
    if (foundItems.length === sceneItems.length) {
      setTimeout(celebrateScene, 500);
    }
  }

  function spawnStars(el, count, emojis) {
    count = count || 8;
    emojis = emojis || ['⭐', '✨', '🌟', '💫'];
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    for (let i = 0; i < count; i++) {
      const star = document.createElement('div');
      star.className = 'star-particle';
      star.textContent = emojis[i % emojis.length];
      const angle = (i / count) * Math.PI * 2;
      const dist = 12; // vmin
      const tx = cx + Math.cos(angle) * (dist * Math.min(window.innerWidth, window.innerHeight) / 100);
      const ty = cy + Math.sin(angle) * (dist * Math.min(window.innerWidth, window.innerHeight) / 100);
      star.style.left = tx + 'px';
      star.style.top = ty + 'px';
      document.getElementById('game').appendChild(star);
      setTimeout(function() { star.remove(); }, 700);
    }
  }

  // ====== 提示系统 ======
  function resetHintTimer() {
    clearTimeout(hintTimer);
    // 移除所有现有提示
    document.querySelectorAll('.hint-pulse').forEach(function(h) { h.remove(); });

    if (!isPlaying) return;
    hintTimer = setTimeout(showHints, 8000);
  }

  function showHints() {
    if (!isPlaying) return;
    sceneItems.forEach(function(si, idx) {
      if (foundItems.includes(idx)) return;
      const hint = document.createElement('div');
      hint.className = 'hint-pulse';
      hint.dataset.idx = idx;
      hint.style.left = si.data.x + '%';
      hint.style.top = si.data.y + '%';
      itemsLayer.appendChild(hint);
    });
  }

  // ====== 位置随机化 ======
  function randomizePositions(items) {
    var OFFSET = 7; // 最大偏移 ±7%
    var MIN_DIST = 14; // 最小间距 14%
    var result = items.map(function(item) {
      return {
        x: item.x + (Math.random() - 0.5) * OFFSET * 2,
        y: item.y + (Math.random() - 0.5) * OFFSET * 2
      };
    });
    // 边界钳制（避开顶部收集栏和边缘）
    result.forEach(function(p) {
      p.x = Math.max(12, Math.min(88, p.x));
      p.y = Math.max(22, Math.min(85, p.y));
    });
    // 碰撞检测：如果两个物品太近，微调
    for (var i = 0; i < result.length; i++) {
      for (var j = i + 1; j < result.length; j++) {
        var dx = result[i].x - result[j].x;
        var dy = result[i].y - result[j].y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < MIN_DIST) {
          // 沿两者连线方向推开
          var push = (MIN_DIST - dist) / 2 + 1;
          var angle = Math.atan2(dy, dx);
          result[i].x = Math.max(12, Math.min(88, result[i].x + Math.cos(angle) * push));
          result[i].y = Math.max(22, Math.min(85, result[i].y + Math.sin(angle) * push));
          result[j].x = Math.max(12, Math.min(88, result[j].x - Math.cos(angle) * push));
          result[j].y = Math.max(22, Math.min(85, result[j].y - Math.sin(angle) * push));
        }
      }
    }
    return result;
  }

  // ====== 场景管理 ======
  function loadScene(idx) {
    isPlaying = false;
    foundItems = [];
    sceneItems = [];
    sceneDecos = [];
    litDecos = new Set();

    // 清空
    itemsLayer.innerHTML = '';
    collectBar.innerHTML = '';
    document.querySelectorAll('.star-particle, .confetti, .hint-pulse, .word-flash').forEach(function(e) { e.remove(); });

    const scene = SCENES[idx];
    sceneBg.style.background = scene.bg;

    // 收集槽
    scene.items.forEach(function() {
      const slot = document.createElement('div');
      slot.className = 'slot';
      collectBar.appendChild(slot);
    });

    // 装饰物
    scene.decos.forEach(function(d) {
      const el = document.createElement('div');
      el.className = 'deco';
      el.textContent = d.emoji;
      el.style.left = d.x + '%';
      el.style.top = d.y + '%';
      itemsLayer.appendChild(el);
      sceneDecos.push({ el: el, data: d });
    });

    // 隐藏物品（位置随机化）
    var positions = randomizePositions(scene.items);
    scene.items.forEach(function(item, i) {
      const el = document.createElement('div');
      el.className = 'item';
      if (item.photo) {
        var img = document.createElement('img');
        img.src = item.photo;
        img.className = 'item-photo';
        img.draggable = false;
        el.appendChild(img);
      } else {
        el.textContent = item.emoji;
      }
      el.style.left = positions[i].x + '%';
      el.style.top = positions[i].y + '%';
      itemsLayer.appendChild(el);
      sceneItems.push({ el: el, data: { ...item, x: positions[i].x, y: positions[i].y } });
    });

    // 场景介绍
    introIcon.textContent = scene.icon;
    introName.textContent = scene.name;
    sceneIntro.classList.add('show');

    // 重置手电筒到中心
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    updateFlashlight(cx, cy);

    setTimeout(function() {
      sceneIntro.classList.remove('show');
      isPlaying = true;
      resetHintTimer();
      startBgMusic();
    }, 1500);
  }

  function celebrateScene() {
    isPlaying = false;
    stopBgMusic();
    clearTimeout(hintTimer);
    document.querySelectorAll('.hint-pulse').forEach(function(h) { h.remove(); });

    // 遮罩变亮
    flashlightMask.style.background = 'rgba(0,0,0,0.3)';
    warmGlow.style.background = 'none';

    // 庆祝文字
    celebration.classList.add('show');

    // 音效
    playCelebSound();

    // 纸屑
    spawnConfetti();

    saveHighScene();

    // 下一场景
    setTimeout(function() {
      celebration.classList.remove('show');
      flashlightMask.style.background = '';
      currentScene = (currentScene + 1) % SCENES.length;
      loadScene(currentScene);
    }, 2500);
  }

  function spawnConfetti() {
    const emojis = ['🎉', '🎊', '⭐', '💛', '🌟', '🎈', '🧡', '💜'];
    for (let i = 0; i < 20; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.textContent = emojis[i % emojis.length];
      c.style.left = (Math.random() * 90 + 5) + '%';
      c.style.top = '-8vmin';
      c.style.animationDuration = (2 + Math.random() * 1.5) + 's';
      c.style.animationDelay = (Math.random() * 0.8) + 's';
      game.appendChild(c);
      setTimeout(function() { c.remove(); }, 4500);
    }
  }

  // ====== 事件 ======
  function handlePointer(e) {
    e.preventDefault();
    let px, py;
    if (e.touches && e.touches.length > 0) {
      px = e.touches[0].clientX;
      py = e.touches[0].clientY;
    } else {
      px = e.clientX;
      py = e.clientY;
    }

    // 首次触摸：隐藏教程
    if (!tutorialShown && gameStarted) {
      tutorialShown = true;
      tutorial.classList.add('hidden');
    }

    updateFlashlight(px, py);
  }

  // 触摸事件
  game.addEventListener('touchstart', handlePointer, { passive: false });
  game.addEventListener('touchmove', handlePointer, { passive: false });

  // 鼠标事件（桌面测试用）
  game.addEventListener('mousedown', handlePointer);
  game.addEventListener('mousemove', handlePointer);

  // 音效开关
  soundBtn.addEventListener('touchstart', function(e) {
    e.stopPropagation();
    e.preventDefault();
    toggleSound();
  });
  soundBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    toggleSound();
  });

  function toggleSound() {
    soundEnabled = !soundEnabled;
    soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
    saveSound();
    if (soundEnabled) {
      ensureAudio();
      startBgMusic();
    } else {
      stopBgMusic();
    }
  }

  // 开始按钮
  startBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    startGame();
  });
  startBtn.addEventListener('click', function(e) {
    startGame();
  });

  function startGame() {
    if (gameStarted) return;
    gameStarted = true;
    ensureAudio();
    splash.classList.add('hidden');
    game.classList.add('active');
    loadScene(currentScene);
  }

  // 阻止默认滚动/缩放
  document.addEventListener('touchmove', function(e) {
    if (e.target.closest('#game')) e.preventDefault();
  }, { passive: false });

  // ====== 初始化 ======
  loadPrefs();

})();
</script>
